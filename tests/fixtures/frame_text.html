<!doctype html>
<html>
<head><title>frame text</title></head>
<body style="margin:0">
  <button id="decoy" style="position:absolute;left:0;top:0;width:300px;height:200px"
          onclick="document.title='WRONG'">Decoy</button>
  <iframe id="only" style="position:absolute;left:400px;top:300px;width:300px;height:150px;border:0"></iframe>
  <script>
    // Another origin, so the frame is out of process and its coordinates are its own.
    document.getElementById('only').src =
      location.protocol + '//127.0.0.1:' + location.port + '/frames_child.html?name=only';
  </script>
</body>
</html>
