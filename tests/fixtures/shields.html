<!doctype html>
<html>
<head><meta charset="utf-8"><title>shields</title></head>
<body>
<p>Loads a script from an ad host EasyList blocks. The host is mapped to this server.</p>
<script>
  window.adResult = "pending";
  const s = document.createElement("script");
  s.src = "http://pagead2.googlesyndication.com:" + location.port + "/pagead/js/adsbygoogle.js?t=" + Date.now();
  s.onload = () => { window.adResult = "loaded"; };
  s.onerror = () => { window.adResult = "blocked"; };
  document.head.appendChild(s);
</script>
</body>
</html>
