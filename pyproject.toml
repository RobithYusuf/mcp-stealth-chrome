[project]
name = "mcp-stealth-chrome"
version = "0.13.0"
description = "MCP server with 173 tools: a real Chrome browser over CDP with nodriver, HTTP with Chrome's TLS fingerprint, Cloudflare Turnstile handling, session reuse, and web research without API keys"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "RobithYusuf", email = "robithdev@gmail.com" }
]
keywords = [
    "mcp",
    "model-context-protocol",
    "nodriver",
    "stealth",
    "anti-detection",
    "cloudflare-bypass",
    "turnstile",
    "browser-automation",
    "chromium",
    "chrome",
    "claude",
    "captcha",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]
requires-python = ">=3.11"
dependencies = [
    # Upper bound is load-bearing: mcp 2.0.0 removed mcp.server.fastmcp entirely,
    # and this server is built on FastMCP. Without the cap a fresh install
    # resolves to 2.x and the server dies at import with ModuleNotFoundError.
    # Lift it only together with a port to whatever 2.x replaces FastMCP.
    "mcp>=1.2.0,<2",
    # Upper bound is load-bearing too: this server depends on nodriver internals (refs.py,
    # patches.py), and 0.50 already rebuilt Connection and Tab around sessions. uv.lock hides
    # such breakage, so raise this only after running the E2E suites on the new version in a
    # lock-free venv. 0.48.1, 0.50.3 and 0.50.99 all pass.
    "nodriver>=0.48,<0.51",
    "pydantic>=2.5",
    "httpx>=0.27",
    "opencv-python>=4.8",
    "curl-cffi>=0.7",
]

[project.optional-dependencies]
os-cursor = [
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
    "mss>=9; sys_platform != 'darwin'",
]

[project.urls]
Homepage = "https://github.com/RobithYusuf/mcp-stealth-chrome"
Repository = "https://github.com/RobithYusuf/mcp-stealth-chrome"
Issues = "https://github.com/RobithYusuf/mcp-stealth-chrome/issues"

[project.scripts]
mcp-stealth-chrome = "mcp_stealth_chrome.server:main"

[build-system]
requires = ["uv_build>=0.11.3,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]
